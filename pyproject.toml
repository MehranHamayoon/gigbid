[project]
name = "gigbid"
version = "1.0.0"
description = "Evidence-grounded freelance proposals with human approval"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
  "langgraph==1.0.10",
  "langgraph-checkpoint-sqlite==3.0.3",
  "langgraph-checkpoint-postgres==3.0.4",
  "langchain-mcp-adapters==0.2.1",
  "mcp==1.26.0",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.3.2",
  "arq==0.27.0",
  "cryptography==46.0.5",
  "pypdf==6.7.4",
  "python-multipart==0.0.22",
  "reportlab==4.4.10",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.4"]

[project.scripts]
gigbid-portfolio = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "apps.api*", "data*", "gigsim*", "mcp_servers*", "rag*", "worker*"]
namespaces = true

[tool.setuptools.package-data]
data = ["sample/*.json", "personas/*.json", "policy_pack/*.yaml", "policy_pack/*.md"]
agent = ["config.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
