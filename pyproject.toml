[project]
name = "gigbid"
version = "1.0.0"
description = "Evidence-grounded freelance proposals with human approval"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.3.8",
  "arq==0.28.0",
  "cryptography==50.0.2",
  "pypdf==7.0.1",
  "python-multipart==0.0.33",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[project.scripts]
gigbid-portfolio = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "apps.api*", "data*", "gigsim*", "mcp_servers*", "rag*", "worker*"]
namespaces = true

[tool.setuptools.package-data]
data = ["sample/*.json", "personas/*.json", "policy_pack/*.yaml", "policy_pack/*.md"]
agent = ["config.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
