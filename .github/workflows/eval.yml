name: Evaluation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m evals.runners.run_demo_eval --limit 30 --gate
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: evals/results/
