name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: make lint
      - run: python -m pytest -q
      - run: python -m gigsim.seed && git diff --exit-code -- data/personas data/sample/simulator_jobs.json data/sample/simulator_clients.json evals/datasets/local_dev.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
